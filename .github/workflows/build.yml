name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:
    inputs:
      runner_label:
        description: 'macOS host for the same ARM64 iOS build and native checks.'
        required: false
        default: macos-latest
        type: choice
        options:
          - macos-latest
          - macos-26-intel
          - macos-15-intel
      publish:
        description: 'Publish the qualified IPA (off keeps artifacts private).'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # создание релиза и загрузка артефактов

jobs:
  build:
    # Both supported host architectures cross-compile the same ARM64 iOS target.
    # A manual Intel host avoids unavailable ARM64 hosted runner capacity.
    runs-on: ${{ inputs.runner_label || 'macos-latest' }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -x
          sw_vers
          ls -d /Applications/Xcode*.app || true
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          echo "versions.json требует Xcode $XCODE_VERSION"
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "::warning::Xcode $XCODE_VERSION отсутствует на бегунке, беру $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Verify Postbox architecture checks
        run: python3 -m unittest discover -s build-system/Make/tests -p test_postbox_import_check.py

      - name: Restore qualified Bazel action cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ansible-ios-action-cache
          key: ios-actions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: ios-actions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-

      - name: Build the App
        env:
          ANSIBLE_IOS_API_HASH: ${{ secrets.ANSIBLE_IOS_API_HASH }}
        run: |
          set -euo pipefail

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR
          printf '\nbuild --experimental_ui_max_stdouterr_bytes=8388608\n' >> .bazelrc
          AVAILABLE_GB=$(df -g "$RUNNER_TEMP" | tail -1 | awk '{print $4}')
          CACHE_ARGS=()
          if [ "$AVAILABLE_GB" -ge 30 ]; then
            CACHE_ARGS=(--cacheDir="$RUNNER_TEMP/ansible-ios-action-cache")
            printf 'build --experimental_disk_cache_gc_max_size=4G\nbuild --experimental_disk_cache_gc_idle_delay=1s\n' >> .bazelrc
          fi

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          # Disposable self-signed material matches our bundle ID. It is not
          # Apple distribution signing; the published IPA must be re-signed.
          SIGNING_PATH="$RUNNER_TEMP/ansible-ios-ci-signing"
          python3 build-system/Make/PrepareAnsibleCI.py \
            --configuration build-system/ansible-configuration.json \
            --destination "$SIGNING_PATH"
          python3 build-system/Make/ImportCertificates.py \
            --path "$SIGNING_PATH/certs" \
            --passwordFile "$SIGNING_PATH/certs/password.txt" \
            --keychainPath "$SIGNING_PATH/ci.keychain-db"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            "${CACHE_ARGS[@]}" \
            build \
            --configurationPath="build-system/ansible-configuration.json" \
            --codesigningInformationPath="$SIGNING_PATH" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          # 🚨 Шаблон bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/... УСТАРЕЛ: он не
          # раскрывается, и cp падает, хотя сборка прошла. bazel сам печатает
          # готовый файл по пути bazel-bin/iosapp/iosapp.ipa — берём его.
          cp bazel-bin/iosapp/iosapp.ipa "$OUTPUT_PATH/"
          python3 build-system/Make/VerifyAnsibleIPA.py "$OUTPUT_PATH/iosapp.ipa"

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-bin/iosapp/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/iosapp.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Verify native widget runtime and engine on macOS
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          BAZEL=$(find build-input -maxdepth 1 -type f -name 'bazel-*-darwin-*' -print -quit)
          test -n "$BAZEL"
          "$BAZEL" --output_user_root=/private/var/tmp/_bazel_containerhost test             -c opt --test_output=errors             //third-party/quickjs-ng:QuickJSSmokeTests             //third-party/quickjs-ng:QuickJSHostTests             //third-party/quickjs-ng:QuickJSSecurityTests             //submodules/IosappUI/Components/MessageWidget/WidgetRuntime:WidgetRuntimeTests

      - name: Collect bounded compiler diagnostics
        if: always()
        run: |
          python3 build-system/Make/CollectAnsibleBuildErrors.py \
            /private/var/tmp/_bazel_containerhost build/diagnostics/compiler-errors.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-compiler-diagnostics-${{ github.sha }}
          path: build/diagnostics/compiler-errors.json
          if-no-files-found: error
      - name: Preserve reusable Bazel actions
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ansible-ios-action-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Remove disposable signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ansible-ios-ci-signing/ci.keychain-db" || true
          rm -rf "$RUNNER_TEMP/ansible-ios-ci-signing"

      # 🚨 Было три шага на actions/create-release@v1 и upload-release-asset@v1 —
      # оба архивированы GitHub и работают на Node 12, то есть на современном
      # бегунке не запускаются. Заменено на то же действие, что уже используется
      # в репозитории андроида.
      - name: Record immutable artifact provenance
        run: |
          cd /Users/Shared/telegram-ios
          git rev-parse HEAD > build/artifacts/source-sha.txt
          cp versions.json build/artifacts/versions.json
          cd build/artifacts
          shasum -a 256 iosapp.ipa iosapp.DSYMs.zip > SHA256SUMS

      - name: Preserve private release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ansible-ios-${{ env.APP_VERSION }}-${{ github.sha }}
          path: /Users/Shared/telegram-ios/build/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned build
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Ansible ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Ansible for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
            Bundle ID: su.ansible.messenger.
            IPA с временной тестовой подписью: перед установкой требуется переподпись.
            Это не сборка для App Store/TestFlight; тестовая подпись не даёт доступ к APNs.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/iosapp.ipa
            /Users/Shared/telegram-ios/build/artifacts/iosapp.DSYMs.zip
          fail_on_unmatched_files: true
